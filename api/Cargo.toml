[package]
name = "api"
version = "0.1.0-alpha"
edition = "2021"
authors = ["mocrsteel <https://github.com/mocrsteel>"]
repository = "https://github.com/mocrsteel/freezit"
default-run = "api"

[[bin]]
name="api"
path="./src/bin/app.rs"

[[bin]]
name = "playground"
path = "./src/bin/playground.rs"

[[bin]]
name = "seed-db"
path="./src/bin/seed_db.rs"

[features]
all = ["seed"]
seed = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.6", features = ["tower-log", "tracing", "tokio", "macros"] }
bitflags = "2.10.0"
chrono = { version = "0.4.42", features=["serde"] }
colored = "3.0.0"
diesel = { version = "2.3.3", features = ["postgres", "chrono", "uuid"] }
diesel_migrations = { version = "2.3.0", features = ["postgres"] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
fake = { version = "4.4.0", features = ["derive", "uuid"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"]}
jsonwebtoken = { version = "10.1.0", features = ["rust_crypto"] }
lazy_static = "1.4.0"
log = "0.4.20"
oauth2 = "5.0.0"
redis = { version = "0.32.7", features = ["json"] }
regex = "1.10.2"
serde = "1.0.190"
serde_json = "1.0.107"
struct_iterable = "0.1.1"
test-log = "0.2.13"
thiserror = "2.0.17"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["full"] }
tower-sessions = "0.14.0"
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
typeshare = "1.0.4"
uuid = { version = "1.18.1", features = ["serde", "v7", "v4"] }

[dev-dependencies]
colored = "3.0.0"
fake = { version = "4.4.0", features = ["derive", "uuid"] }
tower = { version = "0.5.2", features = ["util"] }
