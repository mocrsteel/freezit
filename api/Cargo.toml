[package]
name = "api"
version = "0.1.0-alpha"
edition = "2021"
authors = ["mocrsteel <https://github.com/mocrsteel>"]
repository = "https://github.com/mocrsteel/freezit"
default-run = "api"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.6", features = ["tower-log", "tracing", "tokio"] }
chrono = { version = "0.4.42", features=["serde"] }
diesel = { version = "2.3.3", features = ["postgres", "chrono"] }
diesel_migrations = { version = "2.3.0", features = ["postgres"] }
dotenvy = "0.15.7"
env_logger = "0.11.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"]}
lazy_static = "1.4.0"
log = "0.4.20"
regex = "1.10.2"
serde = "1.0.190"
serde_json = "1.0.107"
struct_iterable = "0.1.1"
test-log = "0.2.13"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
typeshare = "1.0.4"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[[bin]]
name = "playground"

